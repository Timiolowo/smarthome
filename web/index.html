<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SmartHome — Liquid Glass Control Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/live-display.css" />
  <link rel="stylesheet" href="/css/liquid-glass.css" />
  <link rel="stylesheet" href="/css/standby.css" />
  <link rel="stylesheet" href="/css/settings.css" />
  <script>
    (function () {
      var saved = localStorage.getItem('smarthome_theme') || 'dark';
      if (saved === 'light') {
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>

<body>

  <!-- Ambient Dot Background matching Setup Wizard -->
  <div class="ambient-bg-dots"></div>

  <!-- TARS Ambient Stripe/Grid Background: Scoped to Voice Hub only via body[data-tab="tab-livedisplay"] -->
  <div class="tars-bg"></div>
  <div class="tars-vignette"></div>


  <!-- Fullscreen Kiosk Exit Floating Pill -->
  <button id="btn-kiosk-exit" class="kiosk-exit-btn" onclick="toggleKioskMode(false)"
    title="Exit Fullscreen Kiosk Mode (Esc)">
    <svg class="icon-svg icon-svg-sm" viewBox="0 0 24 24">
      <line x1="18" y1="6" x2="6" y2="18" />
      <line x1="6" y1="6" x2="18" y2="18" />
    </svg>
    <span>Exit Fullscreen</span>
    <span class="kbd">Esc</span>
  </button>

  <div class="liquid-shell">

    <!-- MAIN VIEWPORT -->
    <div class="liquid-main">

      <!-- TARS TOP STATUS STRIP -->
      <!-- include "components/navbar.html" -->

      <!-- PAGE CONTENT CONTAINER -->
      <main class="page-container" style="max-width: 1760px; width: 100%; margin: 0 auto; padding: 0.5rem 2rem 2rem 2rem; box-sizing: border-box;">

        <!-- SECTION 1: HOME OVERVIEW (DEFAULT LANDING VIEW) -->
        <!-- include "components/bento-overview.html" -->

        <!-- SECTION 2: LIVE SMART DISPLAY & VOICE HUD -->
        <!-- include "components/live-display.html" -->

        <!-- SECTION 3: ALARMS & TIMERS -->
        <!-- include "components/alarms-timers.html" -->

        <!-- SECTION 4: RESIDENT DOSSIER -->
        <!-- include "components/resident-dossier.html" -->

        <!-- SECTION 5: AI ARCHITECTURE -->
        <!-- include "components/ai-architecture.html" -->

        <!-- SECTION 6: CONFIGURATION -->
        <!-- include "components/configuration.html" -->

        <!-- SECTION 7: CHAT CONSOLE -->
        <!-- include "components/chat-console.html" -->

      </main>

    </div>

  </div>

  <!-- iOS-Inspired Standby Ambient Mode Component (Global Over-Screen Overlay) -->
  <!-- include "components/standby-display.html" -->

  <!-- Audio Settings Dialog (shadcn/ui Dialog primitive) -->
  <!-- include "components/audio-dialog.html" -->

  <!-- Live Terminal UI Modal Dialog -->
  <!-- include "components/terminal-dialog.html" -->

  <!-- Floating Toast Notifications (shadcn Sonner container) -->
  <div id="sonner-toast-container"></div>

  <!-- Three.js (for optional 3D Particle Orb Mode) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Core (globals, icons — must load first) -->
  <script src="/js/core.js"></script>
  <!-- Independent utilities -->
  <script src="/js/theme.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/ui-effects.js"></script>
  <!-- Routing (depends on toast, ui-effects) -->
  <script src="/js/router.js"></script>
  <!-- Data & rendering -->
  <script src="/js/profile.js"></script>
  <script src="/js/timers.js"></script>
  <script src="/js/settings.js"></script>
  <script src="/js/status.js"></script>
  <!-- Interaction -->
  <script src="/js/voice.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/smart-home.js"></script>
  <script src="/js/voice-session.js"></script>
  <script src="/js/live-display.js"></script>
  <script src="/js/audio-health.js"></script>
  <script src="/js/tars-reactor.js"></script>
  <script src="/js/standby-controller.js"></script>
  <script src="/js/terminal-modal.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Route to the correct tab based on URL path (e.g. /voice, /settings, /chat)
      if (typeof routeFromURL === 'function') {
        routeFromURL();
      } else {
        // Fallback: default to AI Voice Hub
        const voiceHubBtn = document.getElementById('nav-btn-livedisplay');
        if (typeof showTab === 'function') {
          showTab('tab-livedisplay', voiceHubBtn);
        }
      }
    });
  </script>
</body>

</html>
