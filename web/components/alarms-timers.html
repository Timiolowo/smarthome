<!-- ==========================================================================
     ALARMS & TIMERS COMPONENT
     Zero Emojis — 100% Inline Lucide SVGs
     ========================================================================== -->
<section id="tab-alarms" class="section-card">
  <div class="bento-grid">
    
    <!-- Set Quick Timers (6 cols) -->
    <div class="bento-col-6 card card-spotlight">
      <div class="card-header">
        <div class="card-title-group">
          <div class="card-title">
            <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span>Quick Countdown Timer</span>
          </div>
          <div class="card-description">Set a fast timer in seconds or presets.</div>
        </div>
      </div>
      <div class="card-content">
        <div style="display:flex; flex-wrap:wrap; gap:0.5rem; margin-bottom:1rem;">
          <button class="btn btn-secondary btn-sm" onclick="document.getElementById('alarm-seconds').value=300; setTimerSeconds();">5 Minutes</button>
          <button class="btn btn-secondary btn-sm" onclick="document.getElementById('alarm-seconds').value=600; setTimerSeconds();">10 Minutes</button>
          <button class="btn btn-secondary btn-sm" onclick="document.getElementById('alarm-seconds').value=900; setTimerSeconds();">15 Minutes</button>
          <button class="btn btn-secondary btn-sm" onclick="document.getElementById('alarm-seconds').value=1800; setTimerSeconds();">30 Minutes</button>
        </div>
        <div style="display:flex; gap:0.5rem;">
          <input type="number" id="alarm-seconds" class="btn btn-outline" style="flex:1; text-align:left;" placeholder="Seconds (e.g. 45)"/>
          <button class="btn btn-primary" onclick="setTimerSeconds()">Start Timer</button>
        </div>
      </div>
    </div>

    <!-- Set Clock Alarm (6 cols) -->
    <div class="bento-col-6 card card-spotlight">
      <div class="card-header">
        <div class="card-title-group">
          <div class="card-title">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span>Scheduled Clock Alarm</span>
          </div>
          <div class="card-description">Trigger alarm at an exact scheduled time.</div>
        </div>
      </div>
      <div class="card-content">
        <div style="display:flex; gap:0.5rem; margin-bottom:1rem;">
          <input type="time" id="alarm-clock" class="btn btn-outline" style="flex:1; text-align:left;"/>
          <button class="btn btn-primary" onclick="setClockAlarm()">Set Alarm</button>
        </div>
        <button class="btn btn-secondary btn-sm" onclick="testChime()">
          <svg class="icon-svg icon-svg-sm" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          <span>Test Audio Chime</span>
        </button>
      </div>
    </div>

    <!-- Active Timers List (12 cols) -->
    <div class="bento-col-12 card card-spotlight">
      <div class="card-header">
        <div class="card-title">
          <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span>Active Countdowns & Alarms</span>
          <span id="active-timers-count-pill" class="badge badge-warning" style="margin-left:0.5rem;">0 Active</span>
        </div>
        <button id="cancel-all-timers-btn" class="btn btn-destructive btn-sm" style="display:none;" onclick="cancelAllTimers()">Cancel All</button>
      </div>
      <div class="card-content">
        <div id="alarms-active-timers-container">
          <!-- Rendered dynamically -->
        </div>
      </div>
    </div>

  </div>
</section>
