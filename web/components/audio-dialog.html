<!-- ==========================================================================
     AUDIO SETTINGS DIALOG (shadcn/ui Dialog Primitive)
     Zero Emojis — 100% Inline Lucide SVGs
     ========================================================================== -->
<div id="audio-settings-dialog" class="dialog-overlay" onclick="if(event.target===this) toggleAudioHealthModal(false)">
  <div class="dialog-box">
    <div class="card-header" style="border-bottom:1px solid hsl(var(--border));">
      <div class="card-title">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
        <span>Audio Hardware & Calibrations</span>
      </div>
      <button class="drawer-close-btn" onclick="toggleAudioHealthModal(false)">
        <svg class="icon-svg icon-svg-sm" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="card-content" style="padding:1.25rem;">
      <div style="font-size:0.85rem; color:hsl(var(--muted-foreground)); line-height:1.5;">
        Physical microphone inputs and output speakers managed by sounddevice / macOS AVFoundation.
      </div>
      <div id="audio-health-content" style="margin-top:1rem;">
        <div class="badge badge-success">Audio Engine: Active</div>
      </div>
    </div>
  </div>
</div>
